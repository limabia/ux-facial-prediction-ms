[project]
name = "faceux"
version = "0.1.0"
description = "Pipeline para análise de expressões faciais e experiência do usuário (UEQ-S) em sessões de jogos digitais."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Bianca Lima Santos" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=1.4",
  "matplotlib>=3.6",
  "seaborn>=0.12",
  "scikit-learn>=1.4",
  "xgboost>=1.7",
  "scipy>=1.10",
  "tqdm>=4.66",
  "opencv-python>=4.8",
  "statsmodels>=0.14",
  "mediapipe>=0.10.31",
]

[dependency-groups]
dev = [
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modeling"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM", "PIE", "I", "RUF", "PERF"]
ignore = ["E501"]
